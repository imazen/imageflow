name: Pages

on:
  # Runs on pushes targeting the default branch.
  #
  # This said `[$default-branch]` — the literal placeholder from GitHub's
  # workflow scaffold. GitHub substitutes it when you create a workflow through
  # the web UI template picker, but never at run time, so the branch filter
  # matched a branch named `$default-branch` and this workflow had zero runs in
  # its entire history. docs.imageflow.io is a live Pages site configured with
  # build_type=workflow, i.e. it expects this workflow to be its publisher, so
  # it has been serving whatever was built before the placeholder crept in.
  push:
    branches: [main]
    # The book is the only thing built here; skip the matrix-sized cost of a
    # run for commits that cannot change it.
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the in-progress
# run and the latest queued one. `cancel-in-progress` is false on purpose:
# cancelling a Pages run that has reached `deploy` can leave the live site
# half-published, which is why GitHub's own starter workflow sets it this way.
# Superseded runs are still bounded — they wait rather than pile onto runners.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          # Pinned, not 'latest'. This workflow's first-ever run failed because
          # mdbook had moved to 0.5.x, which rejects the `multilingual` key
          # docs/book.toml carried; with 'latest' the build's success depends on
          # what upstream released that morning.
          mdbook-version: '0.5.4'

      # `-d` resolves against the working directory, not the book root, so
      # `../_site` wrote the book to the parent of the workspace — where the
      # upload step, which reads `_site/` inside the workspace, could never
      # find it (`tar: _site/: Cannot open`). Verified against mdbook 0.5.4:
      # `-d _site` lands at the workspace root and produces all 31 pages.
      - name: mdbook build
        run:  mdbook build -d _site ./docs

      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
