[workspace]
members = [
    "append_only_set",
    "imageflow_helpers",
    "imageflow_http_helpers",
    "imageflow_types",
    "imageflow_riapi",
    "imageflow_core",
    "imageflow_abi",
    "imageflow",
    "imageflow_tool",
    "c_components",
#    "c_components/tests",
]
resolver = "2"

[profile.release]
debug = true
split-debuginfo = "packed"
strip = true
lto = true
# enable on musl: strip = true
# enable on musl: lto = true

# RIAPI Tests take 600ms each at 0, 200ms each at 1, 36ms each at 2, 26ms each at 3
[profile.test]
opt-level = 2

