# Measures how much thread stack moxcms needs to build the transforms imageflow asks it for
# (imageflow#737). Each moxcms version is an optional, renamed dependency; build one at a time
# with `--features v0_8_1`, `v0_9_1`, `v0_9_2`, `master`, `pin` or `patched`. run.sh builds the ones in $VERSIONS
# and sweeps stack sizes.
[package]
name = "moxcms-stack-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace, not a member of imageflow's.
[workspace]

# The features imageflow_core enables (imageflow_core/Cargo.toml).
[dependencies]
moxcms_0_8_1 = { package = "moxcms", version = "=0.8.1", features = ["in_place", "options"], optional = true }
moxcms_0_9_1 = { package = "moxcms", version = "=0.9.1", features = ["in_place", "options"], optional = true }
# 0.9.2, the first release with moxcms PR 211 (2026-11-07), from git: Cargo can't lock two
# semver-compatible versions from crates.io. The crate was packaged from this commit
# (.cargo_vcs_info.json), and its src/ is byte-identical to the tag's.
moxcms_0_9_2 = { package = "moxcms", git = "https://github.com/awxkee/moxcms", rev = "7678ef70f6a7abcf5df7492dd76af3ebb3e85e53", features = ["in_place", "options"], optional = true }
# Upstream master on 2026-10-28, unreleased (its Cargo.toml still says 0.9.1).
moxcms_master = { package = "moxcms", git = "https://github.com/awxkee/moxcms", rev = "097dccf3a9ab40811f23baa5da71cbfb985f8de8", features = ["in_place", "options"], optional = true }
# Upstream main with PR 211 merged, which imageflow pinned from 2026-11-04 to 2026-11-07.
moxcms_pin = { package = "moxcms", git = "https://github.com/awxkee/moxcms", rev = "841044439077ec1ec67a71b2db979ab51d304fcf", features = ["in_place", "options"], optional = true }
# That master with the large tables moved to the heap: branch heap-lookup-tables of lilith/moxcms.
moxcms_patched = { package = "moxcms", git = "https://github.com/lilith/moxcms", rev = "6279765571d39230674cf5d40376330deaa07e35", features = ["in_place", "options"], optional = true }

[features]
v0_8_1 = ["dep:moxcms_0_8_1"]
v0_9_1 = ["dep:moxcms_0_9_1"]
v0_9_2 = ["dep:moxcms_0_9_2"]
master = ["dep:moxcms_master"]
pin = ["dep:moxcms_pin"]
patched = ["dep:moxcms_patched"]

# Codegen settings of imageflow's [profile.release]: opt-level 3, fat LTO.
[profile.release]
lto = true
